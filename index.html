Object.values(TH).forEach(t=>{t.bg=t.bg||t.v['--bg'];t.ink=t.ink||t.v['--ink']});

let AC;function beep(f,d=.08,t='sine',v=.07){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const vib=m=>{if(S.hap&&navigator.vibrate)try{navigator.vibrate(m)}catch(e){}};

const SH=[['.###...###.','#####.#####','###########','###########','###########','.#########.','..#######..','...#####...','....###....','.....#.....'],['....#....','...###...','..#####..','.#######.','#########','.#######.','.###.###.','.###.###.','.###.###.','.###.###.'],['....#....','...###...','..#####..','.#######.','#########','.#######.','..#####..','...###...','....#....'],['.....#.....','.....#.....','....###....','###########','.#########.','..#######..','..#######..','.####.####.','.###...###.','.##.....##.']].map(r=>({w:r[0].length,h:r.length,c:r.join('').split('').map(ch=>ch==='#')})),SN=['Heart','House','Diamond','Star'];
function mkPath(c,dir,w,h,bn,pd){const hd=c[c.length-1],R=[],inb=(x,y)=>x>=0&&y>=0&&x<w&&y<h;let x=hd[0]+dir[0],y=hd[1]+dir[1],ld=dir;while(inb(x,y)){R.push([x,y]);x+=dir[0];y+=dir[1]}
if(bn){const ex=hd[0]+dir[0]*R.length,ey=hd[1]+dir[1]*R.length;x=ex+pd[0];y=ey+pd[1];while(inb(x,y)){R.push([x,y]);x+=pd[0];y+=pd[1]}ld=pd}
const P=c.concat(R),e=P[P.length-1],N=Math.max(w,h)+c.length+2;for(let k=1;k<=N;k++)P.push([e[0]+ld[0]*k,e[1]+ld[1]*k]);return{R,P}}

for(let t=0;t<w*h*(m?16:8);t++){const x=r()*w|0,y=r()*h|0;if(g[y*w+x]>=0||!ok(x,y))continue;const L=2+(r()*(mx-1)|0),c=[[x,y]],seen=new Set([y*w+x]);let d=-1;
while(c.length<L){const[cx,cy]=c[c.length-1],o=[];for(let k=0;k<4;k++){const nx=cx+D[k][0],ny=cy+D[k][1];if(inb(nx,ny)&&ok(nx,ny)&&g[ny*w+nx]<0&&!seen.has(ny*w+nx))o.push(k)}if(!o.length)break;const k=(d>=0&&o.includes(d)&&r()>turn)?d:o[r()*o.length|0];d=k;const nx=cx+D[k][0],ny=cy+D[k][1];c.push([nx,ny]);seen.add(ny*w+nx)}
if(c.length<2)continue;const hd=c[c.length-1],pv=c[c.length-2],dir=[hd[0]-pv[0],hd[1]-pv[1]],bn=r()<(ty.b||0),pd=r()<.5?[-dir[1],dir[0]]:[dir[1],-dir[0]],{R,P}=mkPath(c,dir,w,h,bn,pd);
if(R.some(([a,b])=>g[b*w+a]>=0||seen.has(b*w+a)))continue;const id=A.length;c.forEach(([a,b])=>g[b*w+a]=id);
A.push({c,dir,R,P,i:id,alive:true,out:false,off:0,col:r()*6|0,sh:-9e9,bt:-9e9,bd:0,cr:-9e9,t:null,b:bn,hp:1})}
let kn=0;if(lk&&A.length>=8){const hf=A.length>>1,pk=(lo,hi,t)=>{let c=0,q=0;while(c<lk&&q++<200){const i=lo+(r()*(hi-lo)|0);if(!A[i].t){A[i].t=t;c++}}};pk(0,hf,'lock');pk(hf,A.length,'key');kn=lk}

const blk=(g,a,now=performance.now(),hard=false)=>{const gh=q=>!hard&&q.t==='ghost'&&gal(q,now)<.6;if(gh(a))return -1;for(let k=0;k<a.R.length;k++){const o=g.occ[a.R[k][1]*g.w+a.R[k][0]];if(o>=0&&!gh(g.A[o])){BK=k+1;return o}}return -1};
const tyFor=n=>({b:n===5?.35:n>5?Math.min(.08+(n-5)*.004,.2):0,a:n===8?.3:n>8?Math.min(.05+(n-8)*.003,.13):0,g:n===12?.25:n>12?Math.min(.05+(n-12)*.003,.14):0});

for(let y=Math.floor(fy);y<=Math.ceil(fy);y++)for(let x=Math.floor(fx);x<=Math.ceil(fx);x++){if(x<0||y<0||x>=G.w||y>=G.h)continue;const o=G.occ[y*G.w+x];if(o<0)continue;const d=Math.hypot(x-fx,y-fy);if(d<bd){bd=d;best=o}}if(best>=0)tap(best)}
Vm.cv.addEventListener('pointerdown',e=>{Vm.cv.setPointerCapture(e.pointerId);if(!ptr.size){drag=0;pinch=0}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});if(ptr.size===2)pinch=1});
Vm.cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const r=Vm.cv.getBoundingClientRect();
if(ptr.size===2){const o=[...ptr.entries()].find(([id])=>id!==e.pointerId)[1],d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y),m0x=(p.x+o.x)/2,m0y=(p.y+o.y)/2,m1x=(e.clientX+o.x)/2,m1y=(e.clientY+o.y)/2;
if(d0>0)zoomAt(Vm,m1x-r.left,m1y-r.top,Vm.tz*d1/d0);Vm.tpx+=m1x-m0x;Vm.tpy+=m1y-m0y;clampP(Vm);snap(Vm)}
else{if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>8)drag=1;if(drag){Vm.tpx+=e.clientX-p.x;Vm.tpy+=e.clientY-p.y;clampP(Vm);snap(Vm)}}p.x=e.clientX;p.y=e.clientY});
const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(e.type==='pointerup'&&!drag&&!pinch&&!ptr.size&&G)pickAt(e.clientX,e.clientY)};
Vm.cv.addEventListener('pointerup',up);Vm.cv.addEventListener('pointercancel',up);
Vm.cv.addEventListener('wheel',e=>{e.preventDefault();const r=Vm.cv.getBoundingClientRect();zoomAt(Vm,e.clientX-r.left,e.clientY-r.top,Vm.tz*Math.exp(-e.deltaY*.0016))},{passive:false});
$('#zi').onclick=()=>zoomAt(Vm,Vm.W/2,Vm.H/2,Vm.tz*1.35);$('#zo').onclick=()=>zoomAt(Vm,Vm.W/2,Vm.H/2,Vm.tz/1.35);$('#zf').onclick=()=>{Vm.tz=1;Vm.tpx=Vm.tpy=0};
// buttons
$('#homeB').onclick=home;$('#setB').onclick=settings;$('#tSet').onclick=settings;$('#tLv').onclick=levels;$('#tPlay').onclick=()=>start(S.lvl);$('#tDaily').onclick=()=>start(1,'daily');$('#tChal').onclick=()=>start(1,'chal');$('#tInfo').onclick=guide;$('#infoB').onclick=guide;$('#rstB').onclick=()=>start(G.n,G.mode);
$('#hintB').onclick=()=>{if(G.over)return;const a=G.A.find(a=>a.alive&&blk(G,a,0,true)<0&&(a.t!=='lock'||G.keys>0));if(a&&spend('hints',25)){Vm.hint={id:a.i,until:performance.now()+2800};save();ui()}};
$('#undoB').onclick=()=>{if(!G.undo.length||G.lives<1||G.won||!spend('undos',15))return;const id=G.undo.pop(),a=G.A[id];if(a.t==='key')G.keys=Math.max(0,G.keys-1);if(a.t==='lock')G.keys++;if(a.t==='armor')a.hp=1;a.alive=true;a.out=false;a.c.forEach(([x,y])=>G.occ[y*G.w+x]=id);save();ui();beep(330,.1)};
let lct=-1,last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;const t=!$('#title').classList.contains('gone');
if(Math.abs(S.coins-cd)>.5){cd+=(S.coins-cd)*Math.min(1,dt*8);}else cd=S.coins;const ct=Math.round(cd);if(ct!==lct){lct=ct;$('#coins').innerHTML='<svg class="i"><use href="#i-coin"/></svg> '+ct}
if(t){demoTick(dt,now);render(Vd,now,dt)}else if(G)render(Vm,now,dt);PT=PT.filter(p=>p.l>0);requestAnimationFrame(frame)}
theme(S.theme);G=Object.assign(gen(1,7919+13),{n:1,mode:'lvl',sh:-1,keys:0,lives:3,mist:0,undo:[],won:false,over:false,pi:-1,msg:''});setBoard(Vm,G);ui();home();requestAnimationFrame(frame);addEventListener('pointerdown',()=>{if(S.mus&&!mi)music()},{once:true});
</script></body></html>
